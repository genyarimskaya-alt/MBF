<!-- ===== HEAD ===== -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxilla-Programm – 7 Tage | Dr. Ales Ulishchenko</title>
<meta name="description" content="Das Maxilla-Programm: Leichtigkeit und Symmetrie ins Gesicht zurückbringen – in 7 Tagen. Ohne Filler, ohne Schiene, ohne Chirurgie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    color: #1a1a1a;
    background: #fff;
    line-height: 1.6;
    font-size: 16px;
  }

  /* ── Tokens ── */
  :root {
    --green-dark:   #0d3d38;
    --green-mid:    #1a7060;
    --green-light:  #3dbcaf;
    --green-teal:   #4ecdc4;
    --orange:       #e07b1a;
    --orange-light: #f4a261;
    --gold:         #c9a84c;
    --bg-light:     #f7f9f7;
    --bg-section:   #eef4f0;
    --text-dark:    #1a1a1a;
    --text-mid:     #3d3d3d;
    --text-light:   #666;
    --white:        #ffffff;
    --radius:       12px;
    --radius-lg:    20px;
    --shadow:       0 4px 24px rgba(0,0,0,0.10);
    --shadow-lg:    0 8px 40px rgba(0,0,0,0.16);
  }

  /* ── Typography ── */
  h1, h2, h3, h4 { line-height: 1.2; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(26px, 4vw, 46px); }
  h2 { font-family: 'Playfair Display', serif; font-size: clamp(22px, 3.2vw, 38px); color: var(--green-dark); }
  h3 { font-size: clamp(17px, 2.4vw, 24px); font-weight: 700; }
  p  { color: var(--text-mid); }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .section    { padding: 72px 0; }
  .section--dark { background: var(--green-dark); color: #fff; }
  .section--dark h2, .section--dark p { color: #fff; }
  .section--gray { background: var(--bg-light); }
  .section--teal { background: linear-gradient(180deg, #cff4f2 0%, #ffffff 100%); }

  /* ── Hero animations ── */
  @keyframes heroFadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroFadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes heroPulseGlow {
    0%, 100% { box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
    50%       { box-shadow: 0 8px 48px rgba(78,205,196,0.35); }
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(26,112,96,0.35); transform: scale(1); }
    50%       { box-shadow: 0 6px 36px rgba(26,112,96,0.60); transform: scale(1.03); }
  }
  .hero-animate-title {
    animation: heroFadeUp 0.7s ease both;
  }
  .hero-animate-img {
    animation: heroFadeIn 0.9s ease 0.3s both, heroPulseGlow 3.5s ease 1.2s infinite;
  }
  .hero-animate-text {
    animation: heroFadeUp 0.7s ease 0.6s both;
  }

  /* ── Stars ── */
  .stars { color: var(--green-light); letter-spacing: 2px; }

  /* ── Buttons ── */
  .btn-cta {
    display: inline-block;
    background: var(--green-mid);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 18px 48px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background .2s, transform .15s;
    letter-spacing: .3px;
  }
  .btn-cta { animation: btnPulse 2.2s ease-in-out infinite; }
  .btn-cta:hover { background: #125448; transform: translateY(-2px); animation: none; box-shadow: 0 6px 32px rgba(26,112,96,0.5); }
  .btn-cta--large { font-size: 20px; padding: 22px 60px; }
  .btn-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #25d366;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    transition: background .2s;
  }
  .btn-whatsapp:hover { background: #1ebe5d; }

  /* ── Badge ── */
  .badge-discount {
    display: inline-block;
    background: #c0392b;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 50px;
    letter-spacing: .5px;
  }

  /* ── Price block ── */
  .price-old { text-decoration: line-through; color: var(--text-light); font-size: 20px; }
  .price-new { font-size: 52px; font-weight: 800; color: var(--green-dark); line-height: 1; }

  /* ── Countdown ── */
  .countdown {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    font-size: 36px;
    font-weight: 800;
    color: var(--green-dark);
    font-variant-numeric: tabular-nums;
  }
  .countdown__unit { text-align: center; }
  .countdown__label { font-size: 11px; font-weight: 500; color: var(--text-light); display: block; margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }
  .countdown__sep { color: var(--green-mid); margin-bottom: 18px; }

  /* ── Cards ── */
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
  }
  .card--green-border { border-left: 4px solid var(--green-light); }

  /* ── Grid helpers ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 768px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }

  /* ── Cross icon ── */
  .icon-cross {
    width: 36px; height: 36px;
    background: var(--green-dark);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    flex-shrink: 0;
  }

  /* ── Circle icon ── */
  .icon-circle {
    width: 52px; height: 52px;
    background: var(--green-dark);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 22px;
    flex-shrink: 0;
  }

  /* ── Testimonial carousel ── */
  .carousel-track { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 16px; scroll-snap-type: x mandatory; }
  .carousel-track::-webkit-scrollbar { height: 6px; }
  .carousel-track::-webkit-scrollbar-thumb { background: var(--green-light); border-radius: 3px; }
  .testimonial-card {
    min-width: 280px;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-snap-align: start;
    flex-shrink: 0;
  }
  .testimonial-card img { width: 100%; display: block; }
  .testimonial-card__body { padding: 20px; }
  .testimonial-card__body ul { padding-left: 18px; }
  .testimonial-card__body li { color: var(--text-mid); font-size: 14px; margin-bottom: 6px; }

  /* ── Steps (5-step) ── */
  .steps-row {
    display: flex;
    gap: 0;
    align-items: flex-start;
    overflow-x: auto;
  }
  .step-item { flex: 1; min-width: 180px; position: relative; padding: 0 12px; }
  .step-item::after {
    content: '→';
    position: absolute;
    right: -16px;
    top: 52px;
    font-size: 24px;
    color: var(--green-light);
  }
  .step-item:last-child::after { display: none; }
  .step-circle {
    width: 100px; height: 100px;
    border: 3px solid var(--green-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
  }
  .step-circle img { width: 80px; height: 80px; object-fit: contain; filter: invert(1) sepia(1) saturate(0) brightness(2); }
  .step-num {
    width: 30px; height: 30px;
    background: var(--green-dark);
    border: 2px solid var(--green-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    margin: 0 auto 8px;
  }
  .step-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px 16px;
    margin-top: 12px;
  }
  .step-card h4 { color: var(--green-dark); font-size: 14px; margin-bottom: 8px; }
  .step-card p  { font-size: 13px; color: var(--text-mid); }

  /* ── Accordion FAQ ── */
  .accordion-item {
    border-bottom: 1px solid #e0e8e4;
  }
  .accordion-toggle {
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 20px 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--green-dark);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .accordion-toggle::after { content: '+'; font-size: 24px; color: var(--green-mid); flex-shrink: 0; }
  .accordion-toggle.open::after { content: '−'; }
  .accordion-body {
    display: none;
    padding: 0 0 20px;
    color: var(--text-mid);
    font-size: 15px;
    line-height: 1.7;
  }
  .accordion-body.open { display: block; }

  /* ── Day program ── */
  .day-item {
    border-left: 3px solid var(--green-light);
    padding: 16px 20px;
    margin-bottom: 12px;
    background: #fff;
    border-radius: 0 var(--radius) var(--radius) 0;
    box-shadow: var(--shadow);
  }
  .day-item__label { font-size: 13px; font-weight: 700; color: var(--green-mid); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .day-item__title { font-size: 17px; font-weight: 700; color: var(--green-dark); margin-bottom: 6px; }
  .day-item__desc  { font-size: 14px; color: var(--text-mid); }

  /* ── Comparison table ── */
  .comparison-table { width: 100%; border-collapse: collapse; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .comparison-table th { background: var(--green-dark); color: #fff; padding: 14px 16px; text-align: left; font-size: 14px; }
  .comparison-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #e0e8e4; vertical-align: top; }
  .comparison-table tr:last-child td { border-bottom: none; }
  .comparison-table tr.highlight td { background: #e8f5ee; font-weight: 700; }
  .comparison-table tr:nth-child(even) td { background: var(--bg-light); }
  .comparison-table tr.highlight td:first-child { color: var(--green-dark); }

  /* ── Bonus section ── */
  .bonus-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .bonus-box {
    background: #fff;
    border: 1px solid var(--green-light);
    border-radius: var(--radius);
    padding: 20px 16px;
    width: 140px;
    text-align: center;
    position: relative;
  }
  .bonus-box__tag {
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 50px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .bonus-box__title { font-size: 12px; font-weight: 700; color: var(--green-dark); margin-top: 8px; line-height: 1.3; }
  .bonus-box__icon { font-size: 36px; margin: 8px 0; }

  /* ── Pain points ── */
  .pain-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #e8ede9;
  }
  .pain-item:last-child { border-bottom: none; }
  .pain-item__img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid var(--green-light); }
  .pain-icon { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--green-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 22px; }

  /* ── Guarantee box ── */
  .guarantee-box {
    border: 2px solid var(--green-light);
    border-radius: var(--radius-lg);
    padding: 32px;
    text-align: center;
    background: var(--bg-light);
  }
  .guarantee-box__icon { font-size: 48px; margin-bottom: 12px; }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(180deg, #cff4f2 0%, #ffffff 100%);
    color: var(--text-dark);
    padding: 60px 0 48px;
  }
  .hero h1 { color: var(--green-dark); }
  .hero__meta { font-size: 14px; color: var(--text-light); margin: 8px 0 20px; }
  .hero__sub { font-size: 17px; color: var(--text-mid); margin-bottom: 8px; }
  .hero__layout { display: grid; grid-template-columns: 1fr 380px; gap: 48px; align-items: start; }
  @media (max-width: 860px) { .hero__layout { grid-template-columns: 1fr; } }

  /* ── Price card ── */
  .price-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .price-card__label { font-size: 12px; font-weight: 700; color: #fff; background: #c0392b; padding: 4px 14px; border-radius: 50px; display: inline-block; margin-bottom: 16px; }

  /* ── Dark info bar ── */
  .info-bar {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .info-bar__icon { font-size: 32px; flex-shrink: 0; }

  /* ── After-payment steps ── */
  .payment-step {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid #e0e8e4;
  }
  .payment-step__num {
    width: 36px; height: 36px;
    background: var(--green-mid);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
  }

  /* ── Contact ── */
  .contact-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .contact-card h4 { color: var(--green-dark); margin-bottom: 10px; font-size: 17px; }
  .contact-card p  { font-size: 15px; color: var(--text-mid); margin-bottom: 6px; }

  /* ── Footer ── */
  .footer {
    background: #0f1f16;
    color: rgba(255,255,255,0.55);
    padding: 40px 0;
    font-size: 13px;
    text-align: center;
  }
  .footer a { color: rgba(255,255,255,0.55); text-decoration: underline; }
  .footer__logo { font-weight: 800; font-size: 18px; color: #fff; letter-spacing: 1px; margin-bottom: 12px; display: block; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .section { padding: 48px 0; }
    .btn-cta { padding: 16px 32px; font-size: 16px; }
    .btn-cta--large { font-size: 17px; padding: 18px 36px; }
    .countdown { font-size: 28px; }
    .price-new { font-size: 44px; }
    .steps-row { flex-direction: column; }
    .step-item::after { display: none; }
    .bonus-grid { gap: 10px; }
    .bonus-box { width: 120px; }
  }

  /* ── Utility ── */
  .text-center { text-align: center; }
  .text-green  { color: var(--green-light); }
  .text-teal   { color: var(--green-teal); }
  .text-gold   { color: var(--gold); }
  .mt-8  { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mt-32 { margin-top: 32px; }
  .mt-48 { margin-top: 48px; }
  .mb-8  { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .mb-32 { margin-bottom: 32px; }
  .fw-700 { font-weight: 700; }
  .fw-800 { font-weight: 800; }
</style>
